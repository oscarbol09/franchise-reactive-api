AWSTemplateFormatVersion: '2010-09-09'
Description: 'Infrastructure as Code (CloudFormation) for Franchise Reactive API Persistence (RDS MySQL 8.4 & ECR)'

Parameters:
  EnvironmentName:
    Type: String
    Default: prod
    AllowedValues: [dev, staging, prod]
    Description: Target deployment environment
  DatabaseName:
    Type: String
    Default: franchise_db
  DatabaseMasterUsername:
    Type: String
    Default: franchise_admin

Resources:
  FranchiseVpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.20.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: !Sub 'franchise-api-${EnvironmentName}-vpc'

  PrivateSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref FranchiseVpc
      CidrBlock: 10.20.10.0/24
      AvailabilityZone: !Select [0, !GetAZs '']

  PrivateSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref FranchiseVpc
      CidrBlock: 10.20.11.0/24
      AvailabilityZone: !Select [1, !GetAZs '']

  DatabaseSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Private subnets for Franchise RDS MySQL
      SubnetIds:
        - !Ref PrivateSubnetA
        - !Ref PrivateSubnetB

  AppSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for Franchise API containers
      VpcId: !Ref FranchiseVpc

  DatabaseSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow port 3306 strictly from AppSecurityGroup
      VpcId: !Ref FranchiseVpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 3306
          ToPort: 3306
          SourceSecurityGroupId: !Ref AppSecurityGroup

  FranchiseRdsInstance:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      DBInstanceIdentifier: !Sub 'franchise-api-${EnvironmentName}-mysql'
      Engine: mysql
      EngineVersion: '8.4.3'
      DBInstanceClass: db.t4g.micro
      AllocatedStorage: 20
      StorageType: gp3
      StorageEncrypted: true
      DBName: !Ref DatabaseName
      MasterUsername: !Ref DatabaseMasterUsername
      ManageMasterUserPassword: true
      DBSubnetGroupName: !Ref DatabaseSubnetGroup
      VPCSecurityGroups:
        - !Ref DatabaseSecurityGroup
      PubliclyAccessible: false
      BackupRetentionPeriod: 7

  FranchiseEcrRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Sub 'franchise-api-${EnvironmentName}'
      ImageTagMutability: IMMUTABLE
      ImageScanningConfiguration:
        ScanOnPush: true

Outputs:
  DatabaseEndpoint:
    Description: RDS MySQL connection hostname
    Value: !GetAtt FranchiseRdsInstance.Endpoint.Address
  EcrRepositoryUri:
    Description: ECR Repository URI
    Value: !GetAtt FranchiseEcrRepository.RepositoryUri
