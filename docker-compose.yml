services:
  mysql-db:
    image: mysql:8.4
    container_name: franchise-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: franchise_db
      MYSQL_USER: franchise_user
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-franchise_secret_pwd}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_secret_pwd}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$${MYSQL_PASSWORD}\" mysqladmin ping -h localhost -u \"$${MYSQL_USER}\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - franchise-net

  franchise-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: franchise-api
    restart: unless-stopped
    depends_on:
      mysql-db:
        condition: service_healthy
    environment:
      SERVER_PORT: 8080
      SPRING_R2DBC_URL: r2dbc:mysql://mysql-db:3306/franchise_db?sslMode=PREFERRED&tlsVersion=TLSv1.3
      SPRING_R2DBC_USERNAME: franchise_user
      SPRING_R2DBC_PASSWORD: ${MYSQL_PASSWORD:-franchise_secret_pwd}
      SPRING_FLYWAY_URL: jdbc:mysql://mysql-db:3306/franchise_db?sslMode=PREFERRED&tlsVersions=TLSv1.3
      SPRING_FLYWAY_USER: franchise_user
      SPRING_FLYWAY_PASSWORD: ${MYSQL_PASSWORD:-franchise_secret_pwd}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health/readiness || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
    networks:
      - franchise-net

volumes:
  mysql_data:

networks:
  franchise-net:
    driver: bridge
