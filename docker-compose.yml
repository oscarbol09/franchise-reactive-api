services:
  mysql-db:
    image: mysql:8.4
    container_name: franchise-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: franchise_db
      MYSQL_USER: franchise_user
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-franchise_secret_pwd}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_secret_pwd}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "franchise_user", "-p${MYSQL_PASSWORD:-franchise_secret_pwd}"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - franchise-net

  franchise-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: franchise-api
    restart: unless-stopped
    depends_on:
      mysql-db:
        condition: service_healthy
    environment:
      SERVER_PORT: 8080
      SPRING_R2DBC_URL: r2dbc:mysql://mysql-db:3306/franchise_db?tlsVersion=TLSv1.2
      SPRING_R2DBC_USERNAME: franchise_user
      SPRING_R2DBC_PASSWORD: ${MYSQL_PASSWORD:-franchise_secret_pwd}
      SPRING_FLYWAY_URL: jdbc:mysql://mysql-db:3306/franchise_db?allowPublicKeyRetrieval=true&useSSL=false
      SPRING_FLYWAY_USER: franchise_user
      SPRING_FLYWAY_PASSWORD: ${MYSQL_PASSWORD:-franchise_secret_pwd}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health/readiness || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
    networks:
      - franchise-net

volumes:
  mysql_data:

networks:
  franchise-net:
    driver: bridge
